<!doctype html>
<meta charset="utf-8">
<title>webOS LS2 manifest root</title>
<style>body{background:#000;color:#fff;font:24px/1.5 system-ui;margin:2rem}pre{white-space:pre-wrap;color:#7ff}</style>
<h1>webOS LS2 manifest root</h1><pre id="out">starting...</pre>
<script>
const out=document.getElementById('out');
const log=(x)=>{out.textContent=x;fetch('/log?m='+encodeURIComponent(typeof x==='string'?x:JSON.stringify(x))).catch(()=>{});};
const base=location.href.slice(0,location.href.lastIndexOf('/')+1);
const bridge=()=>new (window.webOSServiceBridge||window.PalmServiceBridge)();
function call(uri,payload){
  return new Promise((resolve,reject)=>{
    const b=bridge();let done=false;
    b.onservicecallback=m=>{ if(done)return;done=true;
      try{const j=JSON.parse(m);log(uri+' => '+JSON.stringify(j));resolve(j)}catch(e){log(uri+' raw => '+m);resolve({raw:m})}};
    setTimeout(()=>{if(!done){done=true;reject(new Error(uri+' timeout'))}},12000);
    b.call(uri,JSON.stringify(payload||{}));
  });
}
function download(file,dir){
  return new Promise((resolve,reject)=>{
    const b=bridge();
    let settled=false;
    b.onservicecallback=message=>{
      if(settled)return;
      let response;
      try{response=JSON.parse(message)}
      catch(error){settled=true;return reject(new Error('download response parse error: '+message))}
      if(response.returnValue===false){
        settled=true;
        return reject(new Error('download failed: '+JSON.stringify(response)));
      }
      if(response.completed===true){
        settled=true;
        log('downloaded '+file);
        return resolve(response);
      }
      if(response.aborted===true||response.interrupted===true){
        settled=true;
        return reject(new Error('download incomplete: '+JSON.stringify(response)));
      }
      if(typeof response.amountReceived==='number'&&typeof response.amountTotal==='number'){
        log('downloading '+file+' '+Math.round(response.amountReceived*100/response.amountTotal)+'%');
      }
    };
    setTimeout(()=>{if(!settled){settled=true;reject(new Error('download timeout: '+file))}},30000);
    b.call('luna://com.webos.service.downloadmanager/download',JSON.stringify({
      target:base+dir+'/'+file,
      targetDir:'/media/internal/downloads',
      targetFilename:file,
      subscribe:true
    }));
  });
}
async function run(){
  log('checking downloadmanager');
  await download('install.manifest.json','manifests');
  await download('install.service','manifests');
  await download('install-hbchannel.sh','scripts');
  await download('autoroot.sh','root');
  await download('hbchannel.ipk','root');
  const add=await call('luna://com.webos.service.bus/addManifestsDir',{
    prefix:'/media/internal/downloads',dirpath:'.'});
  log('addManifestsDir => '+JSON.stringify(add));
  // Trigger values, used one per run in this order (see payload/README.md):
  // 1. install:  luna://com.example.install/test                       {}
  // 2. devmode:  luna://com.webos.appInstallService/dev/remove         {'id':'com.palmdts.devmode','subscribe':true}
  // 3. persist:  luna://org.webosbrew.hbchannel.service/registerActivity {}
  const trigger=await call('luna://com.example.install/test',{});
  log('trigger => '+JSON.stringify(trigger));
}
run().catch(e=>log('ERROR '+e));
</script>
